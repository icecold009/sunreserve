<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 360" role="img" aria-labelledby="title desc">
  <title id="title">SunReserve — plan with tomorrow's sun in mind</title>
  <desc id="desc">A golden sun sends energy toward a trained Ridge model, which connects to a backup reserve symbol above layered teal hills and a solar panel.</desc>
