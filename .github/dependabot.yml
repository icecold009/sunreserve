version: 2
updates:
  - package-ecosystem: pip
    directory: /
    exclude-paths:
      - requirements/compat-minimums.txt
      - requirements/snapshots/**
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: /requirements/snapshots
    schedule:
      interval: weekly
    open-pull-requests-limit: 0 # Disables version update PRs; security updates are separate.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
